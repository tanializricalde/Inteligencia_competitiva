{% extends "layouts/auth.html" %}
{% block auth_content %}
<h1 id="auth-title" class="mt-4">Define una contraseña</h1>
{% if validlink %}
  <form class="stacked-form" method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button class="btn btn-primary w-100" type="submit">Guardar</button>
  </form>
{% else %}
  <div class="alert alert-danger">El enlace no es válido o expiró.</div>
{% endif %}
{% endblock %}
