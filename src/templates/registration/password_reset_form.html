{% extends "layouts/auth.html" %}
{% block auth_content %}
<h1 id="auth-title" class="mt-4">Recuperar acceso</h1>
<p class="text-secondary">Si el correo está registrado, enviaremos instrucciones.</p>
<form class="stacked-form" method="post">
  {% csrf_token %}
  {{ form.as_div }}
  <button class="btn btn-primary w-100" type="submit">Enviar</button>
</form>
{% endblock %}
