{% extends "layouts/app.html" %}{% block content %}<h1>Ejecuciones</h1><div class="card"><table class="table"><thead><tr><th>ID</th><th>Origen</th><th>Estado</th><th>Inicio</th><th>Resumen</th></tr></thead><tbody>{% for run in runs %}<tr><td><a href="{% url 'run_detail' run.id %}">#{{ run.id }}</a></td><td>{{ run.get_origin_display }}</td><td>{{ run.get_status_display }}</td><td>{{ run.started_at|date:"d/m/Y H:i" }}</td><td>{{ run.summary }}</td></tr>{% empty %}<tr><td colspan="5">Sin ejecuciones.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
