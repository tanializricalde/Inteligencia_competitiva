services:
  web:
    build: .
    image: market-watch:${IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      ALLOW_INSECURE_LOCAL_HTTP: ${ALLOW_INSECURE_LOCAL_HTTP:-false}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60 --access-logfile -
    ports: ["127.0.0.1:${WEB_PORT:-8000}:8000"]
    volumes:
      - sqlite-data:/app/data
      - evidence-data:/app/evidence
      - media-data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/public/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  scheduler:
    build: .
    image: market-watch:${IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      ALLOW_INSECURE_LOCAL_HTTP: ${ALLOW_INSECURE_LOCAL_HTTP:-false}
    command: python manage.py run_scheduler
    volumes:
      - sqlite-data:/app/data
      - evidence-data:/app/evidence
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["development"]
    ports: ["8025:8025", "1025:1025"]
    restart: unless-stopped

volumes:
  sqlite-data:
  evidence-data:
  media-data:

