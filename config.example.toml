[providers.review_sources.config]
page_size = 10
max_scrolls = 50
stable_scroll_attempts = 8
scroll_pause_ms = 1000
scroll_pause_jitter_ms = 400
scroll_distance_min = 600
scroll_distance_max = 1200
scroll_rest_every = 5
scroll_rest_ms = 2000
max_load_seconds = 60
