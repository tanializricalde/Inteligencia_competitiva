platform = "google_maps"
country_code = "EC"
enabled = true
timeout_seconds = 90
retry_limit = 3
request_delay_seconds = 3
max_pages = 2

# Perfil mediano: alrededor de 50 reseñas en un solo lote.
[providers.review_sources.config]
page_size = 100
max_scrolls = 250
stable_scroll_attempts = 12
scroll_pause_ms = 1300
scroll_pause_jitter_ms = 600
scroll_distance_min = 600
scroll_distance_max = 1400
scroll_rest_every = 10
scroll_rest_ms = 3000
max_load_seconds = 300

[[providers]]
code = "perseo"
name = "Perseo"
